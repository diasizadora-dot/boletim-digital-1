<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boletim Digital</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Cabeçalho do Boletim -->
        <header class="cabecalho">
            <h1>Boletim Digital ⚡</h1>
            <h2>8º Ano - Ensino Fundamental</h2>
            <p class="aluno">Estudante: <span>Estudante Exemplo</span></p>
        </header>

        <!-- Cards de Resumo -->
        <section class="cards-resumo">
            <div class="card">
                <h3>Média Geral</h3>
                <p id="media-geral">—</p>
            </div>
            <div class="card">
                <h3>Total de Faltas</h3>
                <p id="total-faltas">—</p>
            </div>
            <div class="card">
                <h3>Bom Desempenho</h3>
                <p id="bom-desempenho">—</p>
            </div>
            <div class="card">
                <h3>Previsão / Atenção</h3>
                <p id="precisa-atencao">—</p>
            </div>
            <div class="card">
                <h3>Frequência Geral</h3>
                <p id="frequencia-geral">92%</p>
                <small>Frequência adequada</small>
            </div>
        </section>

        <!-- Tabela de Disciplinas -->
        <section class="tabela-container">
            <table>
                <thead>
                    <tr>
                        <th>Disciplina</th>
                        <th>1º Tri</th>
                        <th>2º Tri</th>
                        <th>3º Tri</th>
                        <th>Média</th>
                        <th>Faltas</th>
                        <th>Situação</th>
                    </tr>
                </thead>
                <tbody id="tabela-corpo">
                    <!-- As disciplinas serão inseridas dinamicamente pelo JavaScript -->
                </tbody>
            </table>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
